name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (supports a single uploaded game.zip)
        run: |
          if [ -f game.zip ]; then
            mkdir -p project && unzip -q -o game.zip -d project
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi
          test -f "$(grep PROJECT_DIR $GITHUB_ENV | cut -d= -f2)/project.godot"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "GODOT_BIN=$RUNNER_TEMP/godot" >> "$GITHUB_ENV"

      - name: Configure Android SDK + debug keystore for Godot
        run: |
          set -e
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
          cat > "$HOME/.config/godot/$f" << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Import project resources
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          "$GODOT_BIN" --headless --verbose --import || true
          "$GODOT_BIN" --headless --verbose --import || true

      - name: Export APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --verbose --export-debug "Android" build/WarbandAges.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: WarbandAges-apk
          path: ${{ env.PROJECT_DIR }}/build/WarbandAges.apk
          if-no-files-found: error
