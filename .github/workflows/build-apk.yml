
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract and locate Godot project
        shell: bash
        run: |
          set -e

          mkdir -p project

          if [ -f files.zip ]; then
            unzip -q -o files.zip -d project
          fi

          if [ -f project/game.zip ]; then
            mkdir -p project/game
            unzip -q -o project/game.zip -d project/game
          fi

          PROJECT_FILE=$(find project -type f -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Godot project: $PROJECT_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP"

          curl -fL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"

          curl -fL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          echo "GODOT_BIN=$RUNNER_TEMP/godot" >> "$GITHUB_ENV"

      - name: Configure Android SDK and debug keystore
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -deststoretype pkcs12

          mkdir -p "$HOME/.config/godot"

          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > "$HOME/.config/godot/$f" << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done

      - name: Validate project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          test -f project.godot
          test -f export_presets.cfg
          echo "Godot project and export presets found."

      - name: Import project resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          "$GODOT_BIN" --headless --editor --path . --import

      - name: Check project scripts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          "$GODOT_BIN" --headless --path . --editor --quit

      - name: Export APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          mkdir -p build

          "$GODOT_BIN" --headless --verbose \
            --path . \
            --export-debug "Android" build/WarbandAges.apk

          test -f build/WarbandAges.apk
          ls -lh build/WarbandAges.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WarbandAges-apk
          path: ${{ env.PROJECT_DIR }}/build/WarbandAges.apk
          if-no-files-found: error
